<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Ranking System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- D3.js (for Chain Map) + Three.js (WebGL rendering). The two Three.js URLs
     must stay on the same version: the build is published as r128 and the
     matching examples bundle as 0.128.0. -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#8b5cf6', 600: '#7c3aed' },
                        dark: { 800: '#1e1e2d', 900: '#151521' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/css/index.css">
    <!-- Section Specific Styles -->
    <link rel="stylesheet" href="/static/comparison/compare.css">
    <link rel="stylesheet" href="/static/gallery/gallery.css">
    <link rel="stylesheet" href="/static/maps/maps.css">
    
    <link rel="stylesheet" href="/static/build/build.css">
    
    <link rel="stylesheet" href="/static/analyze/analyze.css">
</head>

<body class="min-h-screen custom-scrollbar font-sans antialiased flex flex-col">
    <!-- Nav -->
    <nav class="glass  top-0 z-50 shadow-lg border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-16">
            <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-500">
                Image Ranker</h1>
            <div class="flex items-center gap-3">
                <button class="nav-toggle" id="nav-toggle-btn" aria-label="Menu">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" class="w-6 h-6">
                        <path d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
            </div>
        </div>
        <div class="mobile-nav-menu" id="mobile-nav-menu">
            <a href="#compare">Compare</a>
            <a href="#gallery">Gallery</a>
            <a href="#chains">Maps</a>
            <a href="#database">Database</a>
            <a href="#build">Build</a>
            <a href="#training">Training</a>
            <a href="#analyze">Analyze</a>
        </div>
    </nav>

    <!-- Compare Selected. Shared by the gallery and chain-map sections, which
         both had their own copy of this control with the same element ids. The
         router shows it only for those two sections and delegates the click to
         whichever instance is current. -->
    <div id="compare-selected-wrap" class="hidden container mx-auto px-2 md:px-4 pb-2 flex justify-center">
        <button id="compare-selected-btn"
            onclick="router.compareSelected()"
            class="hidden px-6 py-2 bg-pink-600 hover:bg-pink-500 text-white rounded-lg transition text-sm font-bold shadow-lg flex items-center gap-2 animate-pulse">
            Compare Selected (<span id="selected-count">0</span>)
        </button>
    </div>

    <!-- Main Content Area -->
    <main id="app-content" class="flex-grow container mx-auto px-2 py-4 md:px-4 md:py-8">
        <!-- Section content injected by SPA router -->
    </main>

    <!-- Toast notifications are appended to the body by shared/js/utils.js -->

    <!-- Core Logic -->
    <script src="/js/logger.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/utils.js"></script>
<script src="/js/section_view.js"></script>

    <!-- Section Logic -->
    <script src="/static/comparison/compare_queue.js"></script>
    <script src="/static/comparison/compare_view.js"></script>
    <script src="/static/comparison/compare.js"></script>
    <script src="/static/gallery/gallery.js"></script>
    <!-- Graph Map (physics-based chain visualization) -->
    <script src="/static/maps/graph_map/constants.js"></script>
    <script src="/static/maps/graph_map/utils.js"></script>
    <script src="/static/maps/graph_map/three_renderer.js"></script>
    <script src="/static/maps/graph_map/webgl_physics.js"></script>
    <script src="/static/maps/graph_map/main.js"></script>
    <script src="/static/maps/graph_map/physics.js"></script>
    <script src="/static/maps/graph_map/dom_cache.js"></script>
    <script src="/static/maps/graph_map/persistence.js"></script>
    <script src="/static/maps/graph_map/filters.js"></script>
    <script src="/static/maps/graph_map/hud.js"></script>
    <script src="/static/maps/graph_map/tooltip.js"></script>
    <script src="/static/maps/graph_map/details_panel.js"></script>
    <script src="/static/maps/graph_map/interactions.js"></script>
    <script src="/static/maps/graph_map/actions.js"></script>
    <script src="/static/maps/graph_map/events.js"></script>
    <script src="/static/maps/graph_map/backend.js"></script>

    <!-- Section Controllers -->
    <script src="/static/database/database.js"></script>
    <script src="/static/build/build.js"></script>
    <script src="/static/training/training.js"></script>
    <script src="/static/analyze/analyze.js"></script>

    <!-- Router -->
    <script src="/js/index.js"></script>
</body>

</html>
