<div id="build-container" class="max-w-3xl mx-auto space-y-6">
    <!-- Data Pipeline -->
    <div class="glass rounded-2xl p-6 shadow-2xl">
        <div class="section-title">Data Pipeline</div>
        <div class="space-y-3">
            <div class="action-row">
                <button class="action-btn primary" data-action="prepare-split">🔀 Prepare Split</button>
                <span class="action-desc">Build split vector files</span>
            </div>
            <div class="action-row">
                <button class="action-btn primary" data-action="prepare-full">📦 Prepare Full</button>
                <span class="action-desc">Build full vectors + text data from existing splits</span>
            </div>
            <div class="action-row">
                <button class="action-btn primary" data-action="prepare-all">▶ Prepare All</button>
                <span class="action-desc">Run the full pipeline: splits → full vectors → scores</span>
                <div class="action-extra">
                    <span class="text-xs text-gray-500">Limit:</span>
                    <button class="limit-btn" data-prepare-limit="10">10</button>
                    <button class="limit-btn" data-prepare-limit="100">100</button>
                    <button class="limit-btn" data-prepare-limit="1000">1000</button>
                    <button class="limit-btn" data-prepare-limit="2000">2000</button>
                    <button class="limit-btn" data-prepare-limit="0">All</button>
                    <label class="batch-label">
                        <input type="checkbox" id="batch-toggle" class="accent-purple-500">
                        <span>Batch</span>
                    </label>
                    <span class="text-purple-400" id="prepare-limit-display">Current: 100</span>
                </div>
            </div>
            <div class="action-row">
                <button class="action-btn danger" data-action="delete-vectors">🗑 Delete Full Vectors</button>
                <span class="action-desc">Remove full vector files, keeping split data</span>
            </div>
        </div>
    </div>

    <!-- Log Output -->
    <div class="glass rounded-2xl p-6 shadow-2xl">
        <div class="flex items-center justify-between mb-3">
            <div class="section-title mb-0">Output Log</div>
            <button id="clear-log-btn" class="text-xs text-gray-500 hover:text-white transition">Clear</button>
        </div>
        <div id="log-area" class="log-area" style="max-height: 300px;">
            <div class="text-gray-500">Ready.</div>
        </div>
    </div>
</div>
