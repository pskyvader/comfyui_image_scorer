name: Check Dependency Sync

on:
  push:
    paths:
      - "pyproject.toml"
      - "requirements.txt"
  pull_request:
    paths:
      - "pyproject.toml"
      - "requirements.txt"

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          # Keep in sync with the uv pin in requirements.txt, so CI resolves
          # with the same version that generated the file.
          version: "0.13.8"

      - name: Check requirements.txt matches pyproject.toml
        run: |
          uv pip compile pyproject.toml --universal --output-file=- | diff - requirements.txt