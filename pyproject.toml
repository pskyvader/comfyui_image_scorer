[project]
name = "comfyui-image-scorer"
version = "0.1.0"
requires-python = ">=3.13"
description = "Image scoring for ComfyUI optimized for Python 3.14 and CUDA 13.0"
dependencies = [
    "flask>=3.1.2",
    "lightgbm>=4.6.0",
    "numpy>=2.4.0rc1",
    "onnxmltools>=1.15.0",
    "pytest>=9.0.2",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.2.0",
    "sentencepiece>=0.2.1",
    "skl2onnx>=1.19.1",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "tqdm>=4.66.5",
    "papermill>=2.5.0",
    "nbformat>=5.9.0",
    "nbconvert>=7.2.0",
    "asttokens>=3.0.1",
    "comm>=0.2.3",
    "matplotlib>=3.10.8",
    "uv>=0.9.26",
    "timm>=1.0.24",
    "jsonlines>=4.0.0",
    "joblib>=1.5.3",
    "scikit-image>=0.26.0",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu130"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project.scripts]
comfyui-scorer = "comfyui_image_scorer.adapters.cli.main:main"

[tool.pytest.ini_options]
addopts = "-s"
pythonpath = [".."]
testpaths = ["tests", "adapters", "domain", "core"]
markers = [
    "realdata: destructive end-to-end tests against the real dataset via a live server",
]
